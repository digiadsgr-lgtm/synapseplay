  <!-- Deep Matte Black-Charcoal Background for LinkedIn -->
  <rect width="1584" height="396" fill="url(#liDarkBg)" />
  <rect x="28" y="24" width="1528" height="348" rx="28" fill="#192023" stroke="#7A9A7B" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Shifted right of x=340 so LinkedIn's bottom-left profile avatar never covers text -->
  <g transform="translate(360, 58)">
    <rect x="0" y="0" width="660" height="38" rx="19" fill="#7A9A7B" fill-opacity="0.22" stroke="#7A9A7B" stroke-width="1.5" />
