<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="igSageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86A787" />
      <stop offset="100%" stop-color="#6B8E6C" />
    </linearGradient>
    <filter id="igShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2C3539" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Sand Background -->
  <rect width="1080" height="1080" fill="#EFE8D8" />
  <rect x="44" y="44" width="992" height="992" rx="56" fill="#FAF6EE" stroke="#7A9A7B" stroke-width="5" filter="url(#igShadow)" />

  <!-- Top Category Badge -->
  <rect x="220" y="96" width="640" height="54" rx="27" fill="#7A9A7B" fill-opacity="0.2" stroke="#7A9A7B" stroke-width="2" />
  <text x="540" y="131" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" fill="#2C3539">
    🧠 Εξάσκηση Εκτελεστικών Λειτουργιών &amp; ΔΕΠΥ (4–12 ετών)
  </text>

  <!-- Center Signature Sage Sprout Badge -->
  <g transform="translate(400, 190)">
    <rect width="280" height="280" rx="70" fill="url(#igSageGrad)" filter="url(#igShadow)" />
    <circle cx="140" cy="140" r="105" fill="none" stroke="#FAF6EE" stroke-width="6" opacity="0.24" />
    <path d="M 140 35 A 105 105 0 1 1 48 192" fill="none" stroke="#FAF6EE" stroke-width="8" stroke-linecap="round" opacity="0.75" />
    <g transform="translate(140, 152)">
      <path d="M -38 54 Q 0 42 38 54" fill="none" stroke="#EFE8D8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
      <path d="M 0 48 L 0 -28" fill="none" stroke="#FAF6EE" stroke-width="11" stroke-linecap="round" />
      <path d="M 0 10 C -6 -33, -68 -52, -80 -17 C -68 25, -17 25, 0 10 Z" fill="#FAF6EE" />
      <path d="M 0 -10 C 8 -56, 74 -72, 84 -33 C 72 14, 17 10, 0 -10 Z" fill="#FFFFFF" />
      <circle cx="0" cy="-64" r="10" fill="#D97757" stroke="#FAF6EE" stroke-width="3.5" />
      <circle cx="-28" cy="-50" r="5" fill="#FAF6EE" />
      <circle cx="30" cy="-68" r="5" fill="#FAF6EE" />
    </g>
  </g>

  <!-- Brand Name & FocusEngine 5+ -->
  <text x="540" y="555" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="900" fill="#2C3539" letter-spacing="-2">
    SynapsePlay
  </text>
  <rect x="410" y="580" width="260" height="50" rx="25" fill="#4A6B82" fill-opacity="0.16" />
  <text x="540" y="614" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#4A6B82">
    FocusEngine 5+
  </text>

  <!-- Core Headline -->
  <text x="540" y="690" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#7A9A7B">
    Από την οθόνη στην πράξη.
  </text>
  <text x="540" y="738" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="600" fill="#2C3539" opacity="0.88">
    Συγκέντρωση, μνήμη &amp; αυτορρύθμιση χωρίς οθονικό εθισμό.
  </text>

  <!-- 3 Pillars Grid -->
  <g transform="translate(100, 785)">
    <rect x="0" y="0" width="275" height="110" rx="26" fill="#EFE8D8" stroke="#7A9A7B" stroke-width="2.5" />
    <text x="137" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2C3539">🌱 Smooth Landing</text>
    <text x="137" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#4A6B82">Χωρίς εκρήξεις θυμού</text>

    <rect x="302" y="0" width="275" height="110" rx="26" fill="#EFE8D8" stroke="#4A6B82" stroke-width="2.5" />
    <text x="439" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2C3539">🛡️ Χωρίς Ποινές</text>
    <text x="439" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#4A6B82">Μηδενική ματαίωση</text>

    <rect x="605" y="0" width="275" height="110" rx="26" fill="#EFE8D8" stroke="#D97757" stroke-width="2.5" />
    <text x="742" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2C3539">🏃 Κίνηση στον Χώρο</text>
    <text x="742" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#4A6B82">20 Δραστηριότητες</text>
  </g>

  <!-- Footer CTA -->
  <rect x="280" y="932" width="520" height="62" rx="31" fill="#D97757" />
  <text x="540" y="972" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">
    Για Γονείς &amp; Ειδικούς Θεραπευτές ΔΕΠΥ
  </text>
</svg>
