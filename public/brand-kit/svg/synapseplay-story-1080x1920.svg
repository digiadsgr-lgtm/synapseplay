<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="stSageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86A787" />
      <stop offset="100%" stop-color="#6B8E6C" />
    </linearGradient>
    <filter id="stShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2C3539" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Sand Story Background -->
  <rect width="1080" height="1920" fill="#EFE8D8" />
  <circle cx="540" cy="540" r="460" fill="#7A9A7B" opacity="0.08" />

  <!-- Main Story Card -->
  <rect x="56" y="120" width="968" height="1680" rx="64" fill="#FAF6EE" stroke="#7A9A7B" stroke-width="5" filter="url(#stShadow)" />

  <!-- Top Pill -->
  <rect x="190" y="200" width="700" height="64" rx="32" fill="#7A9A7B" fill-opacity="0.2" stroke="#7A9A7B" stroke-width="2" />
  <text x="540" y="242" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#2C3539">
    🧠 Εξάσκηση Προσοχής &amp; Αυτορρύθμισης (4–12 ετών)
  </text>

  <!-- Center Signature Sage Sprout Badge -->
  <g transform="translate(360, 320)">
    <rect width="360" height="360" rx="90" fill="url(#stSageGrad)" filter="url(#stShadow)" />
    <circle cx="180" cy="180" r="135" fill="none" stroke="#FAF6EE" stroke-width="7" opacity="0.24" />
    <path d="M 180 45 A 135 135 0 1 1 62 246" fill="none" stroke="#FAF6EE" stroke-width="10" stroke-linecap="round" opacity="0.75" />
    <g transform="translate(180, 195)">
      <path d="M -48 68 Q 0 54 48 68" fill="none" stroke="#EFE8D8" stroke-width="10" stroke-linecap="round" opacity="0.9" />
      <path d="M 0 62 L 0 -36" fill="none" stroke="#FAF6EE" stroke-width="14" stroke-linecap="round" />
      <path d="M 0 12 C -8 -42, -88 -66, -102 -22 C -88 32, -22 32, 0 12 Z" fill="#FAF6EE" />
      <path d="M 0 -12 C 10 -72, 95 -92, 108 -42 C 92 18, 22 12, 0 -12 Z" fill="#FFFFFF" />
      <circle cx="0" cy="-82" r="13" fill="#D97757" stroke="#FAF6EE" stroke-width="4.5" />
      <circle cx="-36" cy="-64" r="6.5" fill="#FAF6EE" />
      <circle cx="38" cy="-86" r="6.5" fill="#FAF6EE" />
    </g>
  </g>

  <!-- Title & FocusEngine 5+ -->
  <text x="540" y="795" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="900" fill="#2C3539" letter-spacing="-2.5">
    SynapsePlay
  </text>
  <rect x="390" y="830" width="300" height="60" rx="30" fill="#4A6B82" fill-opacity="0.16" />
  <text x="540" y="870" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#4A6B82">
    FocusEngine 5+
  </text>

  <!-- Headline -->
  <text x="540" y="975" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#7A9A7B">
    Από την οθόνη στην πράξη.
  </text>
  <text x="540" y="1035" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#2C3539" opacity="0.88">
    Ήρεμη ψηφιακή γέφυρα χωρίς οθονικό εθισμό.
  </text>

  <!-- 3 Vertical Benefit Cards -->
  <g transform="translate(120, 1100)">
    <rect x="0" y="0" width="840" height="128" rx="32" fill="#EFE8D8" stroke="#7A9A7B" stroke-width="3" />
    <text x="48" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#2C3539">🌱 Ομαλή Αποσύνδεση (Smooth Landing)</text>
    <text x="48" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#4A6B82">Προστασία από την υπερδιέγερση και τις εκρήξεις θυμού</text>

    <rect x="0" y="156" width="840" height="128" rx="32" fill="#EFE8D8" stroke="#4A6B82" stroke-width="3" />
    <text x="48" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#2C3539">🛡️ Μηδενική Ματαίωση &amp; Φωνητική Καθοδήγηση</text>
    <text x="48" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#4A6B82">Χωρίς buzzer ήττας — 16 θεραπευτικοί συνοδοί εξέλιξης</text>

    <rect x="0" y="312" width="840" height="128" rx="32" fill="#EFE8D8" stroke="#D97757" stroke-width="3" />
    <text x="48" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#2C3539">🏃 20 Δραστηριότητες (Ταμπλέτα + Φυσικός Χώρος)</text>
    <text x="48" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#4A6B82">Εργαζόμενη μνήμη, αναστολή παρόρμησης &amp; κίνηση</text>
  </g>

  <!-- CTA Button at Bottom -->
  <rect x="180" y="1610" width="720" height="96" rx="48" fill="#D97757" />
  <text x="540" y="1670" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">
    Δοκιμάστε το Δωρεάν →
  </text>
</svg>
