  <circle cx="920" cy="1520" r="340" fill="#D97757" opacity="0.08" />

  <!-- Instagram Top Safe Zone Indicator Bar (y=155, well below IG profile header) -->
  <rect x="52" y="150" width="976" height="1620" rx="60" fill="#FAF6EE" stroke="#7A9A7B" stroke-width="4" filter="url(#shadow_04)" />

  <!-- Top Brand Header Row inside Safe Zone -->
  <g transform="translate(100, 195)">
