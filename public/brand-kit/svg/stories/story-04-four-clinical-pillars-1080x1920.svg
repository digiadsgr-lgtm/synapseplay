      <rect x="28" y="34" width="110" height="110" rx="28" fill="#FAF6EE" stroke="#7A9A7B" stroke-width="2" />
      <text x="83" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52">👐</text>
