    </linearGradient>
    <linearGradient id="ctaGrad_04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#C56242" />
    </linearGradient>
    <filter id="shadow_04" x="-10%" y="-10%" width="120%" height="120%">
